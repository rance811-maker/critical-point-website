[build]
  command = "corepack enable && pnpm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22.13.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Send the default Netlify subdomain to the primary domain so search engines index one host only.
[[redirects]]
  from = "https://critical-point-ai.netlify.app/*"
  to = "https://meetcriticalpoint.com/:splat"
  status = 301
  force = true
